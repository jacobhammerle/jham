name: Deploy web

on:
  push:
    branches: ["master"]
    paths:
      - "src/**"
      - "assets/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "babel.config.js"
      - "metro.config.js"
      - "tailwind.config.js"
      - "tsconfig.json"
      - "eas.json"
      - ".eas/workflows/deploy-web.yml"

jobs:
  deploy_web:
    name: Deploy web
    type: deploy
    environment: production
    params:
      prod: true
